name: Publish FC27 Objective Hub
on:
  push:
    branches: [main]
    paths-ignore: ['catalog.json']
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "fc27-pages"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalogue parser
        run: python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Refresh public objective catalogue
        id: refresh
        continue-on-error: true
        run: python refresh_catalog.py
      - name: Report refresh status
        run: |
          if [ "${{ steps.refresh.outcome }}" = "failure" ]; then
            echo '⚠️ Source refresh failed. Keeping previously dated catalog.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '✅ Source catalog checked. Check counts and incomplete tasks on the tracker.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit verified catalog updates
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public FC27 objective catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html cloud-sync.js _site/
          if test -f catalog.json; then cp catalog.json _site/; fi
          if test -f manifest.webmanifest; then cp manifest.webmanifest _site/; fi
          if test -f service-worker.js; then cp service-worker.js _site/; fi
          if test -d icons; then cp -R icons _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
